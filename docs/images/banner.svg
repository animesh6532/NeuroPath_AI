<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <!-- Background Gradient -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00001C" />
      <stop offset="50%" stop-color="#000235" />
      <stop offset="100%" stop-color="#142C54" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#60a5fa" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Rect Background -->
  <rect width="1200" height="400" fill="url(#bgGrad)" />

  <!-- Ambient Glow Circles -->
  <circle cx="200" cy="100" r="150" fill="url(#glowGrad)" filter="url(#glow)" />
  <circle cx="950" cy="220" r="180" fill="url(#glowGrad)" filter="url(#glow)" />

  <!-- Decorative Network Nodes / Graph Grid (Right side) -->
  <g stroke="rgba(96, 165, 250, 0.15)" stroke-width="1.5" fill="none">
    <!-- Lines -->
    <line x1="750" y1="80" x2="880" y2="140" />
    <line x1="880" y1="140" x2="820" y2="260" />
    <line x1="820" y1="260" x2="950" y2="300" />
    <line x1="950" y1="300" x2="1050" y2="180" />
    <line x1="1050" y1="180" x2="920" y2="90" />
    <line x1="920" y1="90" x2="880" y2="140" />
    <line x1="880" y1="140" x2="950" y2="300" />
    <line x1="750" y1="80" x2="820" y2="260" />
    <line x1="920" y1="90" x2="1050" y2="180" />
    
    <!-- Outer Rings around Nodes -->
    <circle cx="750" cy="80" r="8" fill="#000235" stroke="#60a5fa" stroke-width="2" filter="url(#glow)" />
    <circle cx="880" cy="140" r="12" fill="#000235" stroke="#38bdf8" stroke-width="2.5" filter="url(#glow)" />
    <circle cx="820" cy="260" r="10" fill="#000235" stroke="#818cf8" stroke-width="2" filter="url(#glow)" />
    <circle cx="950" cy="300" r="14" fill="#000235" stroke="#60a5fa" stroke-width="3" filter="url(#glow)" />
    <circle cx="1050" cy="180" r="9" fill="#000235" stroke="#38bdf8" stroke-width="2" filter="url(#glow)" />
    <circle cx="920" cy="90" r="11" fill="#000235" stroke="#818cf8" stroke-width="2" filter="url(#glow)" />

    <!-- Node Icons (Simplified labels/visuals) -->
    <text x="880" y="144" fill="#ffffff" font-family="'Inter', sans-serif" font-size="10" font-weight="bold" text-anchor="middle">CV</text>
    <text x="820" y="264" fill="#ffffff" font-family="'Inter', sans-serif" font-size="10" font-weight="bold" text-anchor="middle">AI</text>
    <text x="950" y="304" fill="#ffffff" font-family="'Inter', sans-serif" font-size="10" font-weight="bold" text-anchor="middle">DEV</text>
  </g>

  <!-- Typography / Brand (Left side) -->
  <g transform="translate(100, 140)">
    <!-- Tiny Sparkle Icon -->
    <g transform="translate(0, -60)" fill="url(#accentGrad)">
      <path d="M 0,-15 C 0,-5 5,0 15,0 C 5,0 0,5 0,15 C 0,5 -5,0 -15,0 C -5,0 0,-5 0,-15 Z" />
    </g>
    <text x="25" y="-50" fill="rgba(255, 255, 255, 0.7)" font-family="'Inter', sans-serif" font-size="14" font-weight="800" letter-spacing="4">OPEN SOURCE PLATFORM</text>
    
    <!-- Title -->
    <text x="0" y="30" fill="#ffffff" font-family="'Outfit', 'Inter', sans-serif" font-size="64" font-weight="900" letter-spacing="-2">NeuroPath <tspan fill="url(#accentGrad)">AI</tspan></text>
    
    <!-- Subtitle -->
    <text x="0" y="75" fill="rgba(255, 255, 255, 0.65)" font-family="'Inter', sans-serif" font-size="18" font-weight="500">Autonomous Career Intelligence &amp; Assessment Sandbox</text>
    
    <!-- Tags -->
    <g transform="translate(0, 110)">
      <!-- Resume Tag -->
      <rect x="0" y="0" width="100" height="28" rx="14" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(255, 255, 255, 0.15)" stroke-width="1" />
      <text x="50" y="18" fill="rgba(255, 255, 255, 0.8)" font-family="'Inter', sans-serif" font-size="11" font-weight="600" text-anchor="middle">CV Ingestion</text>

      <!-- Interview Tag -->
      <rect x="112" y="0" width="112" height="28" rx="14" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(255, 255, 255, 0.15)" stroke-width="1" />
      <text x="168" y="18" fill="rgba(255, 255, 255, 0.8)" font-family="'Inter', sans-serif" font-size="11" font-weight="600" text-anchor="middle">Voice Mock AI</text>

      <!-- Roadmap Tag -->
      <rect x="236" y="0" width="112" height="28" rx="14" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(255, 255, 255, 0.15)" stroke-width="1" />
      <text x="292" y="18" fill="rgba(255, 255, 255, 0.8)" font-family="'Inter', sans-serif" font-size="11" font-weight="600" text-anchor="middle">Custom Maps</text>

      <!-- Coding Tag -->
      <rect x="360" y="0" width="100" height="28" rx="14" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(255, 255, 255, 0.15)" stroke-width="1" />
      <text x="410" y="18" fill="rgba(255, 255, 255, 0.8)" font-family="'Inter', sans-serif" font-size="11" font-weight="600" text-anchor="middle">IDE Compiler</text>
    </g>
  </g>
</svg>
