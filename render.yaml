services:
  # ============================================================================
  # 🐍 FastAPI Backend Web Service
  # ============================================================================
  - type: web
    name: neuropath-backend
    env: python
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        value: sqlite:///./neuro.db
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_ALGORITHM
        value: HS256
      - key: ALLOWED_ORIGINS
        value: '*'
      - key: UPLOAD_DIR
        value: uploads
      - key: MODEL_PATH
        value: models

  # ============================================================================
  # ⚛️ React Frontend Static Site
  # ============================================================================
  - type: web
    name: neuropath-frontend
    env: static
    buildCommand: cd frontend && npm install && npm run build
    publishPath: frontend/dist
    headers:
      - key: Cache-Control
        value: public, max-age=31536000, immutable
    routes:
      # Direct all SPA routes to index.html for react-router-dom support
      - type: rewrite
        src: /*
        dest: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: neuropath-backend
          property: host
